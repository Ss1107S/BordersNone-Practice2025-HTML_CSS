<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task1</title>
</head>
<style>
    body{
        display: flex;
        min-width: 100vh;
        background-color: rgb(0, 0, 27);
        justify-content: center;
        align-items: stretch;  
    }

    .main{
        display: flex;
        flex: 1;
        padding: 15px 35px;
        background-color: rgb(0, 0, 40);
        border-radius: 15px;
        max-width: 280px;
        flex-direction: column;
    }

    h2, p{
        color: white;
    }

    p{
        margin-top: 2px;
    }
    .main_button{
        background-color: rgb(0, 149, 255);
        border-radius: 15px;
        color: white;
        padding: 7px 5px;
        border: none;
        cursor: pointer;
        width: 30%;
        margin-top: 5px;
    }

</style>
<body>
    <div class="main">
        <h2>Start your next layout drill</h2>
        <p>Rebuild this centered card using flexbox only.</p>
        <button class="main_button">Begin</button>
    </div>
</body>
</html>
