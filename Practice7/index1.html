<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task1</title>
</head>
<style>
    body{
        display: flex;
        width: 100%;
        height: 100vh;
        background-color: rgb(0, 0, 27);
        justify-content: center;
        align-items: center;
        margin: 0;
    }

    .main{
        display: flex;
        flex: 1;
        padding: 15px 40px;
        background-color: rgb(20, 20, 42);
        border-radius: 15px;
        max-width: 280px;
        flex-direction: column;
        box-shadow: 0 18px 40px rgba(25, 39, 69, 0.7);
    }

    h2, p{
        color: white;
    }
    h2{
        margin-bottom: 0;
    }
    .main_button{
        background-color: rgb(0, 149, 255);
        border-radius: 18px;
        color: white;
        padding: 9px 6px;
        border: none;
        cursor: pointer;
        width: 30%;
        margin-bottom: 15px;
    }

</style>
<body>
    <div class="main">
        <h2>Start your next layout drill</h2>
        <p>Rebuild this centered card using flexbox only.</p>
        <button class="main_button">Begin</button>
    </div>
</body>
</html>
